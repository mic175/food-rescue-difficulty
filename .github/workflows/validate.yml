name: Validate offline demo

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install demo dependencies
        run: python -m pip install -r requirements.txt
      - name: Check label mappings and evaluation splits
        run: python -m unittest discover -s tests -v
      - name: Run fictional-data example
        run: python scripts/run_demo.py --output-dir outputs/demo
